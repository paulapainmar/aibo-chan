name: Test Crunchyroll access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probar acceso
        run: |
          for url in \
            "https://www.crunchyroll.com/es/" \
            "https://www.crunchyroll.com/es/search?q=One%20Piece"; do
            echo "== $url"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "$url"
          done
          echo "IP de salida:"
          curl -s https://api.ipify.org; echo